<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento SOX 2026 · DRCAI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
  --red:       #E30613;
  --red-light: #FDECEA;
  --red-mid:   #F9C4C6;
  --magenta:   #E91E8C;
  --mag-light: #FDE8F4;
  --orange:    #F7941D;
  --ora-light: #FEF3E2;
  --green:     #00A651;
  --grn-light: #E2F5EC;
  --blue:      #29ABE2;
  --blu-light: #E8F6FC;
  --purple:    #6B2D8B;
  --pur-light: #F2EAF7;
  --gray-50:   #F7F8FA;
  --gray-100:  #EEF0F4;
  --gray-200:  #DDE0E8;
  --gray-400:  #9DA3B0;
  --gray-600:  #5A6278;
  --gray-800:  #1E2433;
  --white:     #FFFFFF;
  --text:      #1E2433;
  --text-muted:#6B7280;
  --border:    #E4E7EF;
  --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--gray-50);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;font-size:14px}

/* ── HEADER ── */
header{
  background:var(--white);
  border-bottom:1px solid var(--border);
  padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;
  height:60px;position:sticky;top:0;z-index:100;
  box-shadow:var(--shadow);
}
.logo-area{display:flex;align-items:center;gap:14px}
.logo-bar{width:4px;height:32px;background:var(--red);border-radius:2px}
.logo-text{display:flex;flex-direction:column;line-height:1.2}
.logo-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.2px}
.logo-sub{font-size:10px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
.header-actions{display:flex;gap:8px}
.btn-action{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-red{background:var(--red);color:var(--white)}
.btn-red:hover{background:#c4050f}
.btn-outline{background:var(--white);color:var(--gray-600);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--red);color:var(--red)}

/* ── TABS ── */
.tabs-bar{background:var(--white);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;gap:0;overflow-x:auto}
.tab-btn{padding:14px 20px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--red);border-bottom-color:var(--red);font-weight:600}
.tab-add{padding:14px 16px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--gray-400);background:transparent;border:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab-add:hover{color:var(--red)}

/* ── MAIN ── */
main{max-width:1280px;margin:0 auto;padding:28px 32px}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.3px;margin-bottom:3px}
.page-title span{color:var(--red)}
.page-sub{font-size:12px;color:var(--text-muted)}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-top-bar{position:absolute;top:0;left:0;right:0;height:3px}
.stat-num{font-size:32px;font-weight:800;line-height:1;margin-bottom:4px;letter-spacing:-1px}
.stat-label{font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px}
.stat-completada .stat-top-bar{background:var(--green)}
.stat-completada .stat-num{color:var(--green)}
.stat-ontrack .stat-top-bar{background:var(--blue)}
.stat-ontrack .stat-num{color:var(--blue)}
.stat-concern .stat-top-bar{background:var(--orange)}
.stat-concern .stat-num{color:var(--orange)}
.stat-pendiente .stat-top-bar{background:var(--gray-200)}
.stat-pendiente .stat-num{color:var(--gray-600)}
.stat-atrasada .stat-top-bar{background:var(--red)}
.stat-atrasada .stat-num{color:var(--red)}

/* ── CONTROLS ── */
.controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:6px 14px;border-radius:20px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text-muted);transition:all .15s}
.filter-btn:hover{border-color:var(--red);color:var(--red)}
.filter-btn.active{background:var(--red);color:var(--white);border-color:var(--red)}
.filter-btn.f-track.active{background:var(--blue);border-color:var(--blue)}
.filter-btn.f-concern.active{background:var(--orange);border-color:var(--orange)}
.filter-btn.f-comp.active{background:var(--green);border-color:var(--green)}
.ctrl-select,.ctrl-search{font-family:'Inter',sans-serif;font-size:12px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text);outline:none}
.ctrl-select:focus,.ctrl-search:focus{border-color:var(--red)}
.ctrl-search{flex:1;min-width:180px}
.ctrl-select{min-width:180px}

/* ── TABLE ── */
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:24px}
table{width:100%;border-collapse:collapse}
thead th{background:var(--gray-50);padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--gray-100);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--gray-50)}
td{padding:10px 16px;vertical-align:top}

.frente-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.3px}
.ft-f1{background:#E8F6FC;color:#1278A8}
.ft-f2{background:#F2EAF7;color:#5A2577}
.ft-f3{background:#E2F5EC;color:#00733A}
.ft-f4{background:#FEF3E2;color:#B56A00}
.ft-f5{background:#FDECEA;color:#B5000F}
.ft-f6{background:#F7F8FA;color:#5A6278}
.ft-gen{background:#F7F8FA;color:#5A6278}

.task-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.flag-concern{display:inline-block;background:var(--ora-light);color:var(--orange);border:1px solid #F7C87A;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px}
.flag-atrasada{display:inline-block;background:var(--red-light);color:var(--red);border:1px solid var(--red-mid);padding:1px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px}
.note-text{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.5}
.resp-text{font-size:12px;color:var(--gray-600)}

.status-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.s-completada{background:var(--grn-light);color:var(--green)}
.s-on-track{background:var(--blu-light);color:var(--blue)}
.s-concern{background:var(--ora-light);color:var(--orange)}
.s-pendiente{background:var(--gray-100);color:var(--gray-600)}
.s-atrasada{background:var(--red-light);color:var(--red)}

.pbar-wrap{display:flex;align-items:center;gap:6px}
.progress-bar{flex:1;height:5px;background:var(--gray-100);border-radius:3px;overflow:hidden;min-width:60px}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.pct-text{font-size:11px;color:var(--text-muted);min-width:28px;text-align:right}
.date-text{font-size:12px;color:var(--text-muted)}
.date-overdue{color:var(--red);font-weight:600}

.status-select{font-family:'Inter',sans-serif;font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;outline:none}
.status-select:focus{border-color:var(--red)}

.no-results{text-align:center;padding:48px;color:var(--text-muted);font-size:13px}
.task-link{cursor:pointer;color:var(--text)}
.task-link:hover{color:var(--red);text-decoration:underline}
.note-modal-overlay{position:fixed;inset:0;background:rgba(30,36,51,0.4);display:flex;align-items:center;justify-content:center;z-index:400;backdrop-filter:blur(2px)}
.note-modal{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:28px;width:520px;max-width:95vw;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.note-modal-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.4}
.note-modal-frente{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.3px}
.note-modal-body{font-size:13px;color:var(--gray-600);line-height:1.8;white-space:pre-line;background:var(--gray-50);border-radius:8px;padding:16px;border:1px solid var(--border)}
.note-modal-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.meta-item{background:var(--gray-50);border-radius:8px;padding:12px;border:1px solid var(--border)}
.meta-label{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px}
.meta-value{font-size:13px;font-weight:600;color:var(--text)}
.note-modal-close{display:flex;justify-content:flex-end;margin-top:18px;gap:8px}
.note-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.note-field{display:flex;flex-direction:column;gap:4px}
.note-field-full{grid-column:span 2}
.note-field-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px}
.note-field-input{font-family:Inter,sans-serif;font-size:13px;padding:8px 11px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text);outline:none;width:100%}
.note-field-input:focus{border-color:var(--red)}
textarea.note-field-input{resize:vertical;min-height:100px}
.resp-dropdown{position:relative;width:100%}
.resp-trigger{font-family:Inter,sans-serif;font-size:13px;padding:8px 11px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text);width:100%;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;outline:none}
.resp-trigger:focus,.resp-trigger.open{border-color:var(--red)}
.resp-trigger-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.resp-trigger-arrow{font-size:10px;color:var(--text-muted);flex-shrink:0}
.resp-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:500;max-height:240px;overflow-y:auto}
.resp-menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13px;color:var(--text);transition:background .1s}
.resp-menu-item:hover{background:var(--gray-50)}
.resp-menu-item input[type=checkbox]{accent-color:var(--red);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.resp-menu-divider{height:1px;background:var(--border);margin:4px 0}
.resp-custom-row{display:flex;gap:6px;padding:8px 10px}
.resp-custom-input{flex:1;font-family:Inter,sans-serif;font-size:12px;padding:6px 9px;border-radius:6px;border:1px solid var(--border);outline:none}
.resp-custom-input:focus{border-color:var(--red)}
.resp-custom-btn{padding:6px 12px;background:var(--red);color:var(--white);border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.resp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.resp-tag{display:inline-flex;align-items:center;gap:4px;background:var(--red-light);color:var(--red);border:1px solid var(--red-mid);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:500}
.resp-tag-remove{cursor:pointer;font-size:13px;line-height:1;color:var(--red);font-weight:700}
.resp-tag-remove:hover{color:#8B0000}
.resp-selected-box{margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--white)}
.resp-selected-header{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;padding:8px 12px;background:var(--gray-50);border-bottom:1px solid var(--border)}
.resp-selected-empty{padding:14px 12px;font-size:13px;color:var(--text-muted);font-style:italic}
.resp-selected-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--text)}
.resp-selected-item:last-child{border-bottom:none}
.resp-selected-name{display:flex;align-items:center;gap:8px}
.resp-selected-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0}
.resp-remove-btn{padding:3px 10px;border-radius:20px;border:1px solid var(--red-mid);background:var(--red-light);color:var(--red);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.resp-remove-btn:hover{background:var(--red);color:var(--white)}
.manage-resp-list{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--white);margin-top:12px;max-height:300px;overflow-y:auto}
.manage-resp-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--text)}
.manage-resp-item:last-child{border-bottom:none}
.manage-resp-item:hover{background:var(--gray-50)}
.manage-resp-del{padding:3px 10px;border-radius:20px;border:1px solid var(--red-mid);background:var(--red-light);color:var(--red);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.manage-resp-del:hover{background:var(--red);color:var(--white)}
.manage-resp-add-row{display:flex;gap:8px;margin-top:12px}
.manage-resp-input{flex:1;font-family:Inter,sans-serif;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);outline:none;color:var(--text)}
.manage-resp-input:focus{border-color:var(--red)}
.btn-settings{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:6px;font-family:Inter,sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--gray-600);transition:all .15s}
.btn-settings:hover{border-color:var(--red);color:var(--red)}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(2px)}
.loading-spinner{width:40px;height:40px;border:3px solid var(--gray-200);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
.loading-text{font-size:13px;color:var(--text-muted);font-weight:500}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--text-muted)}
.sync-badge.ok{border-color:#00A651;color:#00A651;background:#E2F5EC}
.sync-badge.saving{border-color:var(--orange);color:var(--orange);background:var(--ora-light)}
.sync-badge.error{border-color:var(--red);color:var(--red);background:var(--red-light)}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 32px;color:var(--text-muted)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px;margin-bottom:4px;color:var(--gray-600)}
.empty-state small{font-size:12px}

/* ── EMAIL ── */
.email-section{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:24px;box-shadow:var(--shadow)}
.email-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.email-title span{color:var(--red)}
.email-sub{font-size:12px;color:var(--text-muted);margin-bottom:20px}
.email-config{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.field-label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:5px}
.field-input,.field-textarea{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text);outline:none}
.field-input:focus,.field-textarea:focus{border-color:var(--red)}
.field-textarea{resize:vertical;min-height:56px}
.email-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.divider{height:1px;background:var(--border);margin:16px 0}
.email-preview{background:var(--gray-50);border:1px solid var(--border);border-radius:8px;padding:18px;font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--text);max-height:360px;overflow-y:auto;font-family:monospace}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(30,36,51,0.4);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(2px)}
.modal-box{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:28px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:20px}
.modal-title span{color:var(--red)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-grid .full{grid-column:span 2}
.mfield label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px}
.mfield input,.mfield select,.mfield textarea{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text);outline:none}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{border-color:var(--red)}
.mfield textarea{resize:vertical;min-height:70px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn-ghost{background:var(--white);border:1px solid var(--border);color:var(--gray-600);padding:8px 16px;border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer}
.btn-ghost:hover{border-color:var(--red);color:var(--red)}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;right:28px;background:var(--gray-800);color:var(--white);padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .2s;z-index:999;pointer-events:none;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .email-config{grid-template-columns:1fr}
  main{padding:20px 16px}
  header{padding:0 16px}
  .tabs-bar{padding:0 16px}
}
</style>
</head>
<body>

// ═══════════════ HELPERS ═══════════════
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
}
function computeStatus(t) {
  if (t.status==='Completada') return 'Completada';
  if (t.fin && new Date(t.fin+'T00:00:00') < today) return 'Atrasada';
  return t.status;
}
function statusClass(s){
  return {Completada:'s-completada','On Track':'s-on-track',Concern:'s-concern',Pendiente:'s-pendiente',Atrasada:'s-atrasada'}[s]||'s-pendiente';
}
function fillColor(s){
  return {Completada:'var(--green)','On Track':'var(--blue)',Concern:'var(--orange)',Atrasada:'var(--red)'}[s]||'var(--gray-200)';
}
function frenteClass(f){
  const fl = f.toLowerCase();
  if(fl.includes('f1')) return 'ft-f1';
  if(fl.includes('f2')) return 'ft-f2';
  if(fl.includes('f3')) return 'ft-f3';
  if(fl.includes('f4')) return 'ft-f4';
  if(fl.includes('f5')) return 'ft-f5';
  if(fl.includes('f6')) return 'ft-f6';
  return 'ft-gen';
}
function getTab(id){ return tabsData.find(t=>t.id===id); }
function currentTab(){ return getTab(activeTabId); }
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

// ═══════════════ TABS BAR ═══════════════
function renderTabsBar(){
  document.getElementById('tabsBar').innerHTML =
    tabsData.map(t=>`<button class="tab-btn${t.id===activeTabId?' active':''}" onclick="switchTab('${t.id}')">${t.name}</button>`).join('')
    + `<button class="tab-add" onclick="openNewTabModal()">＋ Nuevo</button>`;
}
function switchTab(id){ activeTabId=id; renderTabsBar(); renderMain(); }

// ═══════════════ FILTERS ═══════════════
function setFilter(key,val,btn){
  tabFilters[activeTabId][key]=val;
  if(key==='status'&&btn){
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  renderMain();
}

// ═══════════════ STATUS UPDATE ═══════════════
function updateStatus(tabId,idx,newStatus){
  const tab=getTab(tabId);
  tab.tasks[idx].status=newStatus;
  if(newStatus==='Completada') tab.tasks[idx].avance=1;
  if(newStatus==='On Track'&&tab.tasks[idx].avance===0) tab.tasks[idx].avance=0.1;
  renderMain(); showToast('Estado actualizado ✓');
}

// ═══════════════ EMAIL ═══════════════
function generateEmail(){
  const tab=currentTab(); const f=tabFilters[tab.id];
  const to=document.getElementById('emailTo').value;
  const from=document.getElementById('emailFrom').value;
  const note=document.getElementById('emailNote').value;
  const scope=f.resp?tab.tasks.filter(t=>t.resp.toLowerCase().includes(f.resp.toLowerCase())):tab.tasks;
  const total=scope.length;
  const comp=scope.filter(t=>computeStatus(t)==='Completada').length;
  const track=scope.filter(t=>computeStatus(t)==='On Track').length;
  const conc=scope.filter(t=>computeStatus(t)==='Concern').length;
  const pend=scope.filter(t=>computeStatus(t)==='Pendiente').length;
  const atras=scope.filter(t=>computeStatus(t)==='Atrasada');
  const avg=total?Math.round(scope.reduce((a,t)=>a+t.avance,0)/total*100):0;
  const dateStr=today.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const respLbl=f.resp?' | Responsable: '+f.resp:'';
  const atrasasList=atras.map(t=>`  • [${t.frente}] ${t.actividad}\n    Vencía: ${fmtDate(t.fin)} — Resp.: ${t.resp}`).join('\n');
  const concernList=scope.filter(t=>computeStatus(t)==='Concern').map(t=>`  • [${t.frente}] ${t.actividad} — ${Math.round(t.avance*100)}%\n    Resp.: ${t.resp}`).join('\n');
  const trackList=scope.filter(t=>computeStatus(t)==='On Track'&&t.avance>0).map(t=>`  • [${t.frente}] ${t.actividad} — ${Math.round(t.avance*100)}%`).join('\n');
  const body=`Asunto: ${tab.name}${respLbl} — ${today.toLocaleDateString('es-CO')}\n\nPara: ${to}\nDe: ${from}\nFecha: ${dateStr}\n\n────────────────────────────────────────────\n${tab.name.toUpperCase()}${respLbl}\nDirección de Riesgos, Controles y Auditoría Interna\n────────────────────────────────────────────\n\nRESUMEN EJECUTIVO\n─────────────────\n  Avance promedio:    ${avg}%\n  Total actividades:  ${total}\n  ✓ Completadas:      ${comp}\n  ↗ On Track:         ${track}\n  ⚡ Concern:         ${conc}\n  ○ Pendientes:       ${pend}\n  ⚠ Atrasadas:        ${atras.length}\n\n${atras.length>0?`ACTIVIDADES ATRASADAS — ATENCIÓN INMEDIATA\n────────────────────────────────────────────\n${atrasasList}\n\n`:''}${conc>0?`ACTIVIDADES EN CONCERN\n────────────────────────────────────────────\n${concernList}\n\n`:''}ACTIVIDADES ON TRACK\n────────────────────────────────────────────\n${trackList||'  (ninguna con avance registrado)'}\n\n${note?`COMENTARIOS ADICIONALES\n────────────────────────────────────────────\n${note}\n\n`:''}────────────────────────────────────────────\nReporte generado automáticamente · Panel Seguimiento SOX 2026\n────────────────────────────────────────────`;
  document.getElementById('emailPreview').textContent=body;
  showToast('Correo generado ✓');
}
function copyEmail(){
  const txt=document.getElementById('emailPreview').textContent;
  if(txt.startsWith('←')){showToast('Primero genera el correo ↑');return;}
  navigator.clipboard.writeText(txt).then(()=>showToast('Copiado ✓'));
}
function openMailto(){
  const txt=document.getElementById('emailPreview').textContent;
  if(txt.startsWith('←')){showToast('Primero genera el correo ↑');return;}
  const to=encodeURIComponent(document.getElementById('emailTo').value);
  const sub=encodeURIComponent(txt.split('\n')[0].replace('Asunto: ',''));
  window.location.href=`mailto:${to}?subject=${sub}&body=${encodeURIComponent(txt)}`;
}

// ═══════════════ EXPORT ═══════════════
function exportHTML(){
  const dataStr=JSON.stringify(tabsData,null,2);
  let src=document.documentElement.outerHTML;
  const marker='';
  const s=src.indexOf(marker);
  if(s!==-1) src=src.substring(0,s)+'/* TABS_DATA_START */\nconst tabsData = '+dataStr+';\n/* TABS_DATA_END */'+src.substring(s+marker.length);
  const blob=new Blob([src],{type:'text/html'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='seguimiento_sox_2026.html'; a.click();
  showToast('HTML exportado ✓');
}

function closeRespMenuOnOutside(e) {
  const dropdown = document.getElementById('nm-resp-dropdown');
  if (dropdown && !dropdown.contains(e.target)) {
    const menu = document.getElementById('nm-resp-menu');
    if (menu) menu.style.display = 'none';
    const trigger = document.getElementById('nm-resp-trigger');
    if (trigger) trigger.classList.remove('open');
    document.removeEventListener('click', closeRespMenuOnOutside);
  }
}

function toggleRespMenu() {
  const menu = document.getElementById('nm-resp-menu');
  const trigger = document.getElementById('nm-resp-trigger');
  if (!menu) return;
  const isOpen = menu.style.display !== 'none';
  menu.style.display = isOpen ? 'none' : 'block';
  trigger.classList.toggle('open', !isOpen);
}

function renderRespCheckboxes() {
  const container = document.getElementById('nm-resp-checkboxes');
  if (!container) return;
  const allResps = [...new Set([...RESP_LIST, ...nmSelectedResps])];
  container.innerHTML = allResps.map(r => `

    </div>`).join('');
}

function deleteRespFromList(name, event) {
  event.stopPropagation();
  if (!confirm('¿Eliminar "' + name + '" de la lista de responsables?')) return;
  RESP_LIST.splice(RESP_LIST.indexOf(name), 1);
  nmSelectedResps = nmSelectedResps.filter(r => r !== name);
  renderRespCheckboxes();
  renderRespTags();
  updateRespTriggerText();
  showToast('"' + name + '" eliminado de la lista ✓');
}

function toggleResp(name, checked) {
  if (checked) {
    if (!nmSelectedResps.includes(name)) nmSelectedResps.push(name);
  } else {
    nmSelectedResps = nmSelectedResps.filter(r => r !== name);
  }
  renderRespTags();
  updateRespTriggerText();
}

function addCustomResp() {
  const input = document.getElementById('nm-resp-custom');
  const val = input.value.trim();
  if (!val) return;
  if (!nmSelectedResps.includes(val)) {
    nmSelectedResps.push(val);
    renderRespCheckboxes();
    renderRespTags();
    updateRespTriggerText();
  }
  input.value = '';
}

function removeResp(name) {
  nmSelectedResps = nmSelectedResps.filter(r => r !== name);
  renderRespCheckboxes();
  renderRespTags();
  updateRespTriggerText();
}

function renderRespTags() {
  const container = document.getElementById('nm-resp-tags');
  if (!container) return;
  if (nmSelectedResps.length === 0) {
    container.innerHTML = `
      <div class="resp-selected-box">
        <div class="resp-selected-header">Responsables seleccionados</div>
        <div class="resp-selected-empty">Ningún responsable seleccionado aún.</div>

  container.innerHTML = `
    <div class="resp-selected-box">
      <div class="resp-selected-header">Responsables seleccionados (${nmSelectedResps.length})</div>

          </div>

function updateRespTriggerText() {
  const el = document.getElementById('nm-resp-trigger-text');

  el.textContent = nmSelectedResps.length > 0

  overlay.onclick = (e) => { if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = buildManageRespHTML();
  document.body.appendChild(overlay);
}

function buildManageRespHTML() {
  const items = RESP_LIST.map((r,i) => `
    <div class="manage-resp-item">
      <span>${r}</span>
      <button class="manage-resp-del" onclick="deleteResp(${i})">Eliminar</button>
    </div>`).join('');
  return `
    <div class="note-modal" style="width:440px">
      <div class="modal-title">Gestionar <span>Responsables</span></div>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:4px">Lista maestra de responsables disponibles en todas las actividades.</p>
      <div class="manage-resp-list">
        ${items || '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">Lista vacía</div>'}
      </div>
      <div class="manage-resp-add-row">
        <input class="manage-resp-input" id="manage-resp-new" placeholder="Nombre del nuevo responsable..." onkeydown="if(event.key==='Enter') addRespToList()">
        <button class="btn-action btn-red" onclick="addRespToList()">+ Agregar</button>
      </div>
      <div class="note-modal-close" style="margin-top:20px">
        <button class="btn-ghost" onclick="document.getElementById('manageRespOverlay').remove()">Cerrar</button>
      </div>
    </div>`;
}

function deleteResp(idx) {
  RESP_LIST.splice(idx, 1);
  const overlay = document.getElementById('manageRespOverlay');
  if (overlay) overlay.innerHTML = buildManageRespHTML();
}

function addRespToList() {
  const input = document.getElementById('manage-resp-new');
  const val = input.value.trim();
  if (!val) return;
  if (!RESP_LIST.includes(val)) {
    RESP_LIST.push(val);
    const overlay = document.getElementById('manageRespOverlay');
    if (overlay) overlay.innerHTML = buildManageRespHTML();
    showToast('Responsable agregado ✓');
  } else {
    showToast('Ya existe en la lista');
  }
  input.value = '';
}

// ═══════════════ JSONBIN CONFIG ═══════════════
const JSONBIN_BIN_ID = '6a9db3caf5f4af5e29723386';
const JSONBIN_API_KEY = '$2a$10$4aAHbIKXdT8ReTyA1mUSxem3vij0IiFFyIEmK9sfhnQlF/HMysNim';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

let isSaving = false;
let saveTimeout = null;

function setSyncBadge(state, msg) {
  const el = document.getElementById('syncBadge');
  if (!el) return;
  el.className = 'sync-badge ' + state;
  const icons = {ok:'✓', saving:'↑', error:'⚠', '':'⬤'};
  el.textContent = (icons[state]||'⬤') + ' ' + msg;
}

function showLoading(msg) {
  let el = document.getElementById('loadingOverlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'loadingOverlay';
    el.className = 'loading-overlay';
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="loading-spinner"></div><div class="loading-text">${msg||'Cargando...'}</div>`;
}

function hideLoading() {
  const el = document.getElementById('loadingOverlay');
  if (el) el.remove();
}

async function loadFromCloud() {
  showLoading('Cargando datos...');
  setSyncBadge('', 'Conectando...');
  try {
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const record = data.record;
    if (record && record.tabs && record.tabs.length > 0
        && record.tabs.some(t => t.tasks && t.tasks.length > 0)) {
      // Cloud has data — merge into tabsData
      record.tabs.forEach(cloudTab => {
        const existing = tabsData.find(t => t.id === cloudTab.id);
        if (existing) {
          existing.tasks = cloudTab.tasks;
          existing.name  = cloudTab.name;
        } else {
          tabsData.push(cloudTab);
          tabFilters[cloudTab.id] = {status:'all', resp:'', search:''};
        }
      });
      if (record.respList && record.respList.length > 0) {
        RESP_LIST.length = 0;
        record.respList.forEach(r => RESP_LIST.push(r));
      }
    } else {
      // Cloud is empty — push local data (first time setup)
      console.log('Cloud empty — pushing local data...');
      await saveToCloud();
    }
    setSyncBadge('ok', 'Sincronizado');
  } catch(e) {
    console.error('Load error:', e);
    setSyncBadge('error', 'Sin conexión — modo local');
  } finally {
    hideLoading();
    renderTabsBar();
    renderMain();
  }
}

async function saveToCloud() {
  if (isSaving) return;
  isSaving = true;
  setSyncBadge('saving', 'Guardando...');
  try {
    const payload = {
      tabs: tabsData.map(t => ({id:t.id, name:t.name, tasks:t.tasks})),
      respList: [...RESP_LIST],
      lastUpdated: new Date().toISOString()
    };
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setSyncBadge('ok', 'Guardado ✓');
  } catch(e) {
    console.error('Save error:', e);
    setSyncBadge('error', 'Error al guardar');
  } finally {
    isSaving = false;
  }
}

// Auto-save with debounce after any change
function scheduleSave() {
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => saveToCloud(), 1500);
}

// Patch all mutating functions to trigger save
const _origUpdateStatus = updateStatus;
updateStatus = function(tabId, idx, newStatus) {
  _origUpdateStatus(tabId, idx, newStatus);
  scheduleSave();
};

const _origSaveNewTask = saveNewTask;
saveNewTask = function() {
  _origSaveNewTask();
  scheduleSave();
};

const _origSaveNewTab = saveNewTab;
saveNewTab = function() {
  _origSaveNewTab();
  scheduleSave();
};

const _origSaveNoteModal = saveNoteModal;
saveNoteModal = function(idx) {
  _origSaveNoteModal(idx);
  scheduleSave();
};

const _origDeleteResp = deleteRespFromList;
deleteRespFromList = function(name, event) {
  _origDeleteResp(name, event);
  scheduleSave();
};

const _origAddRespToList = addRespToList;
addRespToList = function() {
  _origAddRespToList();
  scheduleSave();
};

const _origDeleteRespMgr = deleteResp;
deleteResp = function(idx) {
  _origDeleteRespMgr(idx);
  scheduleSave();
};

// Init — load from cloud first
loadFromCloud();
</script>
